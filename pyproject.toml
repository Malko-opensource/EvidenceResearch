[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "research-state-cli"
version = "0.8.0"
description = "Model-independent research state, preregistration and evidence CLI"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp==2.3.0"]

[project.scripts]
research-state = "research_cli.cli:main"
research-state-mcp = "research_cli.mcp_server:main"
research-state-web = "research_cli.web_server:main"

[tool.setuptools]
packages = ["research_cli"]

[tool.setuptools.package-data]
research_cli = ["web/*.html", "web/*.css", "web/*.js"]
