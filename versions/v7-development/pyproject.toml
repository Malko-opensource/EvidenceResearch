[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-research"
version = "0.4.0.dev0"
description = "Evidence-first, resumable autonomous research with independent verification"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
evidence-research = "evidence_research.cli:main"

[tool.setuptools.packages.find]
include = ["evidence_research*"]
